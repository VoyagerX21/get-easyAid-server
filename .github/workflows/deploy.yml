name: Deploy Get-EasyAid Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: voyagerx21/geteasyserver:latest

      - name: Deploy to Azure VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" << 'EOF'
            set -e

            cd ~/apps/geteasy

            docker compose pull backend
            docker compose up -d backend

            echo "Waiting for backend to become healthy..."

            for i in {1..12}; do
              if curl --fail --silent http://127.0.0.1:5000/health; then
                echo ""
                echo "Backend is healthy."
                docker compose ps backend
                exit 0
              fi

              echo "Backend not ready yet... attempt $i/12"
              sleep 5
            done

            echo "Backend failed to become healthy."
            echo "Backend logs:"
            docker compose logs --tail 100 backend
            exit 1
          EOF